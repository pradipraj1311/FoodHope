name: food_hope
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  share_plus:
  firebase_core:
  firebase_auth:
  cloud_firestore:
  firebase_app_check: ^0.3.1
  flutter_local_notifications: ^17.2.2
  flutter_dotenv: ^5.1.0

  cupertino_icons: ^1.0.2
  intl: ^0.20.2
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

# Flutter Launcher Icons Configuration
# Adaptive config ensures the icon fits perfectly on all Android shapes (Round/Square)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/foodhope_icon_v2.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/foodhope_icon_v2.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/foodhope_icon_v2.png
